      html {

      /* Hover hanya aktif di desktop karena filter liga berupa grid card. */

      }
      .calendar-date-disabled {
        opacity: 0.35;

      }

      .table-row:last-child {
        border-bottom: 0;
      }

      .rank-line::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 10px;
        bottom: 10px;
        width: 5px;
        background: transparent;
      }
      .rank-line.top-zone::before {
        background: #19c37d;
      }

        background: #ffad55;
      }

                renderLeagueFilters();
                renderMatches();
              });
            });
        }

        // Render tujuh pill tanggal, dengan currentDate berada di tengah rentang.
        function renderDatePills() {
          const start = new Date(currentDate);
          start.setDate(start.getDate() - 3);

          datePillsContainer.innerHTML = Array.from({ length: 7 })
            .map((_, index) => {
              const date = new Date(start);
              date.setDate(start.getDate() + index);

              const selected =
                formatDateKey(date) === formatDateKey(currentDate);
              return `
            <button
              type="button"
              data-date="${formatDateKey(date)}"
              aria-pressed="${selected}"
              class="date-pill max-w-[50px] flex-1 px-2 py-2 min-w-[70px] rounded-lg ${selected ? "selected-date" : "hover:bg-gray-50"}"
            >
              <span class="block text-sm font-bold">${daysIndo[date.getDay()].slice(0, 3)}</span>
              <span class="date-sub block text-[12px] ${selected ? "text-white" : "text-[#030712]"}">
                ${date.getDate()} ${monthsIndo[date.getMonth()].slice(0, 3)}
              </span>
            </button>
          `;
            })
            .join("");

          datePillsContainer
            .querySelectorAll("[data-date]")
            .forEach((button) => {
              button.addEventListener("click", () => {
                currentDate = new Date(`${button.dataset.date}T00:00:00`);
                renderDatePills();
                renderMatches();
              });
            });
        }

        // Template satu baris pertandingan. value bisa berupa skor final atau jam kick-off.
        function matchRow(home, away, value) {
          const homeLogo =
            teamLogo[home] ||
            "https://assets.football-logos.cc/logos/england/1500x1500/everton.61ae3574.png";
          const awayLogo =
            teamLogo[away] ||
            "https://assets.football-logos.cc/logos/england/1500x1500/aston-villa.5265a6b0.png";
          const isScore = value.includes("-");

          return `
          <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 px-4 py-3.5">
            <div class="flex min-w-0 items-center justify-end gap-2.5 md:gap-3">
              <span class="truncate text-right text-sm font-medium text-gray-800 md:text-[14px]">${home}</span>
              <img src="${homeLogo}" alt="${home}" class="h-6 w-6 shrink-0 object-contain" />
            </div>

            <div class="rounded-md ${isScore ? "border border-[#FF3B14]/10 bg-[#FFF4EF] text-ink" : "bg-soft text-gray-700"} px-2.5 py-1 text-[14px] whitespace-nowrap">
              ${value}
            </div>

            <div class="flex min-w-0 items-center gap-2.5 md:gap-3">
              <img src="${awayLogo}" alt="${away}" class="h-6 w-6 shrink-0 object-contain" />
              <span class="truncate font-medium text-defaultgray text-sm">${away}</span>
            </div>
          </div>
        `;
        }

        // Filter pertandingan berdasarkan tanggal/liga, lalu kelompokkan per liga.
        function renderMatches() {
          const dateKey = formatDateKey(currentDate);
          const matches = matchDatabase[dateKey] || [];
          const filtered =
            selectedLeague === "semua"
              ? matches
              : matches.filter((m) => m[0] === selectedLeague);

          if (!filtered.length) {
            matchContentContainer.innerHTML = `
            <div class="rounded-2xl border border-line bg-white px-6 py-12 text-center shadow-card">
              <div class="mx-auto mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-soft text-gray-500">
                <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path stroke-linecap="round" d="M12 8v4m0 4h.01"></path>
                </svg>
              </div>
              <p class="text-sm font-semibold text-gray-700">Tidak ada jadwal pertandingan</p>
              <p class="mt-1 text-xs text-gray-400">${niceDate(currentDate)}</p>
            </div>
          `;
            return;
          }

          const groups = {};
          filtered.forEach(([leagueId, home, away, result]) => {
            if (!groups[leagueId]) groups[leagueId] = [];
            groups[leagueId].push({ home, away, result });
          });

          matchContentContainer.innerHTML = Object.entries(groups)
            .map(([leagueId, group]) => {
              const league = leagueById(leagueId);

              return `
            <article class="overflow-hidden bg-white shadow-card">
              <div class="flex items-center justify-center gap-4 bg-soft px-4 py-3 md:px-5">
                <div class="flex items-center gap-2.5">
                  ${
                    league.logo && selectedLeague === "semua"
                      ? `<img src="${league.logo}" alt="${league.name}" class="h-5 w-5 object-contain" />
                         <h3 class="text-sm font-bold text-ink">${league.name}</h3>
                        `
                      : ``
                  }
                </div>
                <span class="text-sm font-bold text-ink">${niceDate(currentDate)}</span>
              </div>

              <div class="divide-y divide-line">
                ${group.map((m) => matchRow(m.home, m.away, m.result)).join("")}
              </div>
            </article>
          `;
            })
            .join("");
        }

        // Render kalender bulanan beserta marker kecil untuk tanggal yang punya jadwal.
        function renderCalendar() {
          const year = calendarDate.getFullYear();
          const month = calendarDate.getMonth();
          calMonthYear.textContent = `${monthsIndo[month]} ${year}`;

          const firstDay = new Date(year, month, 1).getDay();
          const totalDays = new Date(year, month + 1, 0).getDate();
          const prevTotalDays = new Date(year, month, 0).getDate();

          let html = "";

          for (let i = firstDay - 1; i >= 0; i--) {
            html += `<span class="p-2 text-gray-300">${prevTotalDays - i}</span>`;
          }

          for (let day = 1; day <= totalDays; day++) {
            const date = new Date(year, month, day);
            const key = formatDateKey(date);
            const active = key === formatDateKey(currentDate);
            const hasMatches = matchDatabase[key] !== undefined;
            const disabled = !hasMatches;

            html += `
            <button
              type="button"
              data-calendar-date="${key}"
              aria-pressed="${active}"
              ${disabled ? "disabled" : ""}
              class="relative rounded-lg p-2.5 ${disabled ? "calendar-date-disabled" : active ? "bg-ink text-white" : "text-gray-700 hover:bg-soft"}"
            >
              ${day}
              ${hasMatches && !active ? `<span class="absolute bottom-1 left-1/2 h-1 w-1 -translate-x-1/2 rounded-full bg-[#FF3B14]"></span>` : ""}
            </button>
          `;
          }

          calDaysGrid.innerHTML = html;

          calDaysGrid
            .querySelectorAll("[data-calendar-date]")
            .forEach((button) => {
              button.addEventListener("click", () => {
                if (button.disabled) return;
                currentDate = new Date(
                  `${button.dataset.calendarDate}T00:00:00`,
                );
                calendarDate = new Date(currentDate);
                calendarDropdown.classList.add("hidden");
                syncCalendarState(false);
                renderDatePills();
                renderMatches();
              });
            });
        }

        // Render tabel klasemen dan top skor dari data statis.
        function renderTables() {
          standingsBody.innerHTML = standings
            .map(
              (row) => `
          <tr class="table-row border-b border-line relative">
            <td class="relative rank-line text-center ${row.pos <= 4 ? "top-zone" : "neutral-zone"} px-4 py-3.5 text-sm font-semibold text-gray-700">${row.pos}</td>
            <th scope="row" class="px-2 py-3.5 text-left font-normal">
              <div class="flex items-center gap-2.5">
                <img
                  src="${teamLogo[row.club] || teamLogo.Everton}"
                  alt="${row.club}"
                  class="h-7 w-7 object-contain"
                />
                <span class="text-sm text-defaultgray">${row.club}</span>
              </div>
            </th>
            <td class="px-2 py-3.5 text-center text-sm text-ink">${row.played}</td>
            <td class="px-2 py-3.5 text-center text-sm text-ink">${row.win}</td>
            <td class="px-2 py-3.5 text-center text-sm text-ink">${row.draw}</td>
            <td class="px-2 py-3.5 text-center text-sm text-ink">${row.loss}</td>
            <td class="px-2 py-3.5 text-center text-sm text-ink">${row.goals}</td>
            <td class="px-2 py-3.5 text-center text-sm text-ink">${row.diff}</td>
            <td class="px-2 py-3.5 text-center text-sm font-extrabold text-ink">${row.points}</td>
          </tr>
        `,
            )
            .join("");

          scorersBody.innerHTML = scorers
            .map(
              (row, index) => `
          <tr class="table-row border-b border-line ${index === 0 ? "bg-[#FFF9F5]" : ""}">
            <td class="px-4 py-3.5 text-sm font-semibold text-ink text-center">${row.pos}</td>
            <th scope="row" class="px-2 py-3.5 text-left font-normal">
              <div class="flex items-center gap-2.5">
                <img
                  src="${teamLogo[row.club] || teamLogo.Everton}"
                  alt="${row.club}"
                  class="h-6 w-6 object-contain"
                />
                <div class="min-w-0">
                  <div class="truncate text-sm font-bold text-defaultgray">${row.player}</div>
                  <div class="mt-0.5 text-sm text-defaultgray">${row.club}</div>
                </div>
              </div>
            </th>
            <td class="px-4 py-3.5 text-center text-sm text-ink">${row.goals}</td>
            <td class="px-4 py-3.5 text-center text-sm text-ink">${row.pen}</td>
            <td class="px-4 py-3.5 text-center text-sm text-ink">${row.assist}</td>
          </tr>
        `,
            )
            .join("");
        }

        // Event handlers untuk navigasi tanggal, kalender, dan click-away popup.
        document.getElementById("prev-days").addEventListener("click", () => {
          currentDate.setDate(currentDate.getDate() - 1);
          renderDatePills();
          renderMatches();
        });

        document.getElementById("next-days").addEventListener("click", () => {
          currentDate.setDate(currentDate.getDate() + 1);
          renderDatePills();
          renderMatches();
        });

        calendarToggleBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          calendarDropdown.classList.toggle("hidden");
          syncCalendarState(!calendarDropdown.classList.contains("hidden"));
          renderCalendar();
        });

        document
          .getElementById("cal-prev-month")
          .addEventListener("click", () => {
            calendarDate.setMonth(calendarDate.getMonth() - 1);
            renderCalendar();
          });

        document
          .getElementById("cal-next-month")
          .addEventListener("click", () => {
            calendarDate.setMonth(calendarDate.getMonth() + 1);
            renderCalendar();
          });

        document.addEventListener("click", (event) => {
          if (
            !calendarDropdown.contains(event.target) &&
            !calendarToggleBtn.contains(event.target)
          ) {
            calendarDropdown.classList.add("hidden");
            syncCalendarState(false);
          }
        });

        renderLeagueFilters();
        renderDatePills();
        renderMatches();
        renderTables();
        syncCalendarState(false);
      })();
    </script>
  </body>
</html>
